<!doctype html>
<!--
  صفحة الانقطاع — تُخزَّن على الجهاز وقت التثبيت لتُعرض حين لا شبكة.

  وهي ساكنة بلا خطٍّ مستضاف ولا نصٍّ برمجي: كل ما تحتاجه موجود فيها، لأن ما تُعرض
  فيه هو اللحظة التي لا يصل فيها شيء. ولا تحمل أي بيان مريض — تقول ما جرى وحسب.
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لا اتصال — نظام إدارة المركز</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#f5f7fa; color:#0d2137; font-family:system-ui,"Segoe UI",sans-serif; padding:24px; }
  .card { max-width:380px; text-align:center; background:#fff; border:1px solid #e2e8f0;
          border-radius:20px; padding:28px 24px; box-shadow:0 1px 3px rgba(13,33,55,.08); }
  h1 { font-size:19px; margin:16px 0 8px; }
  p { font-size:14px; line-height:1.7; color:#475569; margin:0 0 6px; }
  button { margin-top:18px; width:100%; padding:12px; border:0; border-radius:12px;
           background:#0d2137; color:#fff; font-size:15px; font-weight:700; cursor:pointer; }
</style>
</head>
<body>
  <div class="card">
    <img src="/icon.svg" alt="" width="56" height="56">
    <h1>لا اتصال بالخادم</h1>
    <p>البرنامج مثبَّت على الجهاز، لكن بياناته على الخادم — ولا تُعرض من الذاكرة.</p>
    <p>تأكّد من الشبكة ثم أعد المحاولة.</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
  </div>
</body>
</html>
