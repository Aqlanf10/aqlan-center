name: Verify release
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://test:test-only@localhost:5432/postgres?sslmode=disable
      SESSION_SECRET: ci-test-only-session-secret-not-for-production
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run audit:gate
      - run: npm run typecheck
      - run: npm test
      # هل يُبنى المخطط من الصفر؟ لا تكشفه قاعدةٌ قائمة — الجدول الناقص فيها
      # من قبل. وأسوأ وقتٍ لاكتشاف أنّ البرنامج لا يُثبَّت هو يوم استعادةٍ من
      # نسخةٍ احتياطية بعد كارثة.
      - run: npm run verify:schema
      - run: npm run verify:all
      - run: npm run build
      - run: npm run verify:http
